<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>История</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    background:
        radial-gradient(circle at top left, rgba(255,255,255,0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.08), transparent 35%),
        linear-gradient(
            135deg,
            #050505 0%,
            #111111 25%,
            #1b1b1b 50%,
            #0f0f0f 75%,
            #050505 100%
        );
}
.card{
    width:min(600px,100%);
    padding:52px;
    border-radius:34px;
    background:rgba(255,255,255,0.07);
    backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
        0 10px 50px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.04);
    text-align:center;
}
h1{
    margin-bottom:20px;
    font-size:56px;
    font-weight:700;
    color:#ffffff;
    letter-spacing:-0.03em;
    text-shadow:0 0 24px rgba(255,255,255,0.08);
}
p{
    color:#b8b8b8;
    margin-bottom:34px;
    font-size:18px;
    line-height:1.8;
}
a{
    display:inline-block;
    text-decoration:none;
    padding:16px 28px;
    border-radius:18px;
    background:linear-gradient(135deg,#ffffff,#d3d3d3);
    color:#111111;
    font-weight:700;
    font-size:15px;
    transition:0.28s;
    box-shadow:0 10px 26px rgba(255,255,255,0.12);
}
a:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 34px rgba(255,255,255,0.16);
}
@media(max-width:700px){
    .card{
        padding:38px 26px;
        border-radius:28px;
    }
    h1{
        font-size:44px;
    }
    p{
        font-size:16px;
    }
}
</style>
</head>
<body>
<div class="card">
    <h1>История</h1>
    <p>
        Здесь будет история Кита
    </p>
    <a href="/vocabulary">
        Назад
    </a>
</div>

</body>
</html>
