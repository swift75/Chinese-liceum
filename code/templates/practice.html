<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Практика</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:28px;
    background:
        radial-gradient(circle at top left, rgba(255,255,255,0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.08), transparent 35%),
        linear-gradient(135deg, #050505 0%, #111111 25%, #1b1b1b 50%, #0f0f0f 75%, #050505 100%);
    color:#fff;
}

.card{
    width:min(780px,100%);
    padding:52px;
    border-radius:34px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
        0 10px 50px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.05);
    text-align:center;
}

h1{
    font-size:clamp(38px, 5vw, 54px);
    line-height:1.05;
    color:#ffffff;
    margin-bottom:12px;
    letter-spacing:-0.04em;
    text-shadow:0 0 25px rgba(255,255,255,0.08);
}

.subtitle{
    color:#b8b8b8;
    font-size:18px;
    line-height:1.7;
    margin-bottom:34px;
}

.buttons{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.practice-btn{
    display:block;
    text-decoration:none;
    padding:24px 26px;
    border-radius:24px;
    background:rgba(255,255,255,0.08);
    color:#ffffff;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    transition:0.25s ease;
    text-align:left;
}

.practice-btn:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,0.12);
}

.practice-btn h2{
    font-size:28px;
    margin-bottom:8px;
    color:#ffffff;
}

.practice-btn p{
    color:#d0d0d0;
    line-height:1.7;
    font-size:16px;
}

.back{
    display:inline-block;
    margin-top:34px;
    text-decoration:none;
    padding:14px 22px;
    border-radius:16px;
    background:linear-gradient(135deg,#ffffff,#cfcfcf);
    color:#111111;
    font-weight:700;
    transition:0.25s;
    box-shadow:0 8px 24px rgba(255,255,255,0.12);
}

.back:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(255,255,255,0.16);
}

@media(max-width:640px){
    .card{
        padding:28px 20px;
        border-radius:26px;
    }

    h1{
        font-size:36px;
    }

    .subtitle{
        font-size:16px;
    }

    .practice-btn{
        padding:20px;
    }

    .practice-btn h2{
        font-size:22px;
    }

    .back{
        width:100%;
        text-align:center;
    }
}
</style>
</head>
<body>

<div class="card">

    <h1>Практика</h1>

    <div class="subtitle">
        Выберите режим тренировки для изучения китайского языка.
    </div>

    <div class="buttons">

        <a class="practice-btn" href="{{ url_for('practice_words') }}">
            <h2>Практика слов</h2>
            <p>
                Вам будет показано китайское слово.
                Нужно выбрать правильный перевод из нескольких вариантов.
            </p>
        </a>

        <a class="practice-btn" href="{{ url_for('practice_sentences') }}">
            <h2>Практика предложений</h2>
            <p>
                Вам будет показано китайское предложение.
                Нужно выбрать правильный перевод предложения.
            </p>
        </a>

    </div>

    <a class="back" href="{{ url_for('vocabulary') }}">Назад</a>

</div>

</body>
</html>
