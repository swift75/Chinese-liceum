<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Learning</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left, rgba(255,255,255,0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.08), transparent 35%),
        linear-gradient(135deg,#050505 0%,#111111 25%,#1b1b1b 50%,#0f0f0f 75%,#050505 100%);
    color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
.card-box{
    max-width:600px;
    width:100%;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:34px;
    box-shadow:
        0 10px 50px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.05);
}
.title{
    font-size:clamp(44px,7vw,62px);
    font-weight:700;
    letter-spacing:1px;
    text-shadow:0 0 25px rgba(255,255,255,0.08);
}
.subtitle{
    color:#b8b8b8;
    font-size:18px;
    line-height:1.7;
}
.btn-custom{
    padding:14px 32px;
    border-radius:18px;
    font-weight:600;
    font-size:15px;
}
</style>
</head>
<body class="d-flex justify-content-center align-items-center overflow-hidden p-3">

<div class="card-box text-center p-5 p-md-5">
    <h1 class="title mb-3">Chinese Learning</h1>
    <p class="subtitle mb-4">Китайский язык быстро и удобно</p>

    <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="/login" class="btn btn-light btn-custom">Войти</a>
        <a href="/register" class="btn btn-outline-light btn-custom">Регистрация</a>
    </div>
</div>

</body>
</html>
