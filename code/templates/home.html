<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Learning</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        body{
            font-family:'Manrope',sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background:
                radial-gradient(circle at top left, rgba(255,255,255,0.12), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255,255,255,0.08), transparent 35%),
                linear-gradient(
                    135deg,
                    #050505 0%,
                    #111111 25%,
                    #1b1b1b 50%,
                    #0f0f0f 75%,
                    #050505 100%
                );
        }

        .card{
            width:min(600px,calc(100% - 32px));
            padding:60px;
            border-radius:34px;
            background:rgba(255,255,255,0.06);
            backdrop-filter:blur(24px);
            border:1px solid rgba(255,255,255,0.08);
            box-shadow:
                0 10px 50px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
            text-align:center;
        }

        h1{
            font-size:62px;
            font-weight:700;
            letter-spacing:1px;
            color:#ffffff;
            margin-bottom:16px;
            text-shadow:0 0 25px rgba(255,255,255,0.08);
        }

        p{
            color:#b8b8b8;
            margin-bottom:42px;
            font-size:18px;
            line-height:1.7;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
        }

        a{
            text-decoration:none;
            padding:16px 34px;
            border-radius:18px;
            background:linear-gradient(135deg,#ffffff,#cfcfcf);
            color:#111111;
            font-weight:600;
            font-size:15px;
            transition:0.3s;
            box-shadow:0 8px 24px rgba(255,255,255,0.12);
        }

        a:hover{
            transform:translateY(-4px) scale(1.02);
            box-shadow:0 14px 30px rgba(255,255,255,0.16);
        }

        @media(max-width:700px){
            .card{padding:40px 28px}
            h1{font-size:48px}
            p{font-size:16px}
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Chinese Learning</h1>
        <p>Китайский язык быстро и удобно</p>

        <div class="buttons">
            <a href="/login">Войти</a>
            <a href="/register">Регистрация</a>
        </div>
    </div>
</body>
</html>
